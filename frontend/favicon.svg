<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ffb3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Badge Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="14"/>

  <!-- Code Brackets < > -->
  <path d="M 130 256 L 180 206 M 130 256 L 180 306" fill="none" stroke="#00d4ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 382 256 L 332 206 M 382 256 L 332 306" fill="none" stroke="#00ffb3" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized Letter 'S' -->
  <text x="256" y="325" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="210" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)">S</text>

  <!-- Brand Dot . -->
  <circle cx="395" cy="325" r="18" fill="#00ffb3" filter="url(#glow)"/>
</svg>
